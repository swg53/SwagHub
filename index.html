<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>请假</title>
    <style>
        :root {
            --bg-color: #f7f8fa;
            --text-main: #323233;
            --text-sub: #969799;
            --line-color: #ebedf0;
            --cyan-main: #47c1c4;
            --font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            margin: 0;
            padding-bottom: 100px;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
            /* 增加全局行距与字间距 */
            line-height: 1.5;
            letter-spacing: 0.5px;
        }

        /* 顶部导航 */
        .nav-bar { 
            background: #fff; height: 46px; display: flex; align-items: center; justify-content: center; 
            font-size: 17px; font-weight: 500; border-bottom: 1px solid var(--line-color);
            position: sticky; top: 0; z-index: 100;
        }

        /* 板块：通过 margin-top 撑开灰色空隙 */
        .section { background: #fff; margin-top: 10px; position: relative; }
        
        /* 小标题：去掉粗体，加细横线 */
        .section-title { 
            padding: 16px 16px 10px; 
            font-size: 15px; 
            font-weight: 400; 
            color: var(--text-main); 
            background-color: #fff;
            border-bottom: 1px solid var(--line-color); 
        }

        /* 单元格布局 */
        .cell { display: flex; padding: 12px 16px; font-size: 14px; line-height: 1.4; align-items: flex-start;}
        
        .cell-label { width: 105px; color: var(--text-sub); flex-shrink: 0; }
        
        /* 强制右侧文字为深黑色 */
        .cell-value { flex: 1; color: #323233 !important; word-break: break-all; text-align:left; }

        /* 输入框样式 */
        input { 
            border: none; outline: none; background: transparent; width: 100%; 
            color: #323233 !important; font: inherit; padding:0; text-align:left;
            -webkit-text-fill-color: #323233; /* 兼容 iOS */
            opacity: 1;
        }

        /* 证明材料附件区域 */
        .attachment-upload { display: block; cursor: pointer; }
        .attachment-upload:active { opacity: 0.6; }

        .attachment-box {
            margin: 4px 16px 12px; 
            padding: 10px; 
            background: #f7f8fa; 
            border-radius: 8px;
            display: flex; 
            align-items: center;
            border: 1px dashed #dcdee0;
        }

        .file-icon {
            width: 40px; height: 40px; background: #fff; border-radius: 4px;
            display: flex; align-items: center; justify-content: center; margin-right: 12px;
            border: 1px solid #ebedf0;
        }

        /* 审核流程 */
        .steps-container { background: #fff; padding: 15px 0; }
        .step-item { display: flex; position: relative; min-height: 50px; }
        .step-left { 
            width: 32%; text-align: right; padding-right: 15px; 
            font-size: 12px; color: var(--text-sub); line-height: 1.2;
        }
        .step-icon-column { width: 40px; display: flex; flex-direction: column; align-items: center; position: relative; }
        .step-line { 
            position: absolute; top: 20px; bottom: 0; width: 1px; 
            background-color: var(--line-color); z-index: 1; 
        }
        .step-item:last-child .step-line { display: none; }
        .check-circle { 
            width: 20px; height: 20px; background-color: var(--cyan-main); 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 2; 
        }
        .check-circle svg { width: 12px; height: 12px; fill: none; stroke: white; stroke-width: 3; }
        .step-right { flex: 1; padding-left: 10px; font-size: 14px; line-height: 1.4; color: var(--text-main); }

        /* 底部按钮 */
        .footer { position: fixed; bottom: 0; width: 100%; height: 50px; display: flex; background: #fff; border-top: 1px solid #eee; z-index: 100; }
        .footer button { flex: 1; border: none; font-size: 16px; background: #fff; color: var(--cyan-main); }
        .btn-right { background: var(--cyan-main) !important; color: #fff !important; }

        /* ============ 新增：404 提示（内嵌在本页，不跳转外部页面） ============ */
        .nf-mask {
            position: fixed; inset: 0; z-index: 400;
            background: rgba(0, 0, 0, 0.45);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden;
            transition: opacity .18s ease, visibility .18s ease;
        }
        .nf-mask.show { opacity: 1; visibility: visible; }
        .nf-panel {
            width: 78%; max-width: 300px;
            background: #fff; border-radius: 12px;
            padding: 26px 20px 8px; text-align: center;
            box-shadow: 0 8px 28px rgba(0, 0, 0, .18);
        }
        .nf-code {
            font-size: 40px; font-weight: 700; line-height: 1;
            color: var(--cyan-main); letter-spacing: 2px;
        }
        .nf-title { margin-top: 12px; font-size: 16px; color: var(--text-main); }
        .nf-desc { margin-top: 8px; font-size: 13px; line-height: 1.5; color: var(--text-sub); }
        .nf-btn {
            width: 100%; margin-top: 20px; height: 44px;
            border: none; border-top: 1px solid var(--line-color);
            background: transparent; color: var(--cyan-main);
            font-size: 16px; cursor: pointer;
        }

        /* 模式切换按钮 */
        #mode-btn { position: fixed; right: 15px; bottom: 70px; background: rgba(0,0,0,0.6); color: #fff; border: none; padding: 8px 12px; border-radius: 4px; font-size: 12px; z-index: 200; }
        /* 编辑入口默认不显示，长按“定位销假”后才出现；方块本身不带文字 */
        #mode-btn[hidden] { display: none; }
        #mode-btn {
            width: 26px; height: 26px; padding: 0;
            font-size: 0; line-height: 0; overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            transition: opacity .2s ease;
        }
        /* 进入编辑后黑块常驻，并显示“预览”二字 */
        #mode-btn.with-label {
            width: auto; min-width: 52px; height: 26px;
            padding: 0 10px;
            font-size: 12px; line-height: 26px;
            white-space: nowrap;
        }
        .preview-mode input { pointer-events: none; }
        .edit-mode input { border-bottom: 1px dashed var(--cyan-main); }

        /* ============ 以下为新增：时间滚动选择器 & 日期可编辑样式 ============ */

        /* 日期/时间单元格：做成可点击的样子 */
        .cell-value.has-picker { cursor: pointer; }
        .cell-value.has-picker .picker-text {
            display: inline-block;
            min-height: 20px;
            border-bottom: 1px dashed transparent;
        }
        .edit-mode .cell-value.has-picker .picker-text { border-bottom: 1px dashed var(--cyan-main); }
        .edit-mode .cell-value.has-picker .picker-text.empty { color: var(--text-sub) !important; }
        .cell-value.has-picker:active { opacity: 0.55; }
        /* 右侧小箭头，暗示可以点开选择 */
        .cell-value.has-picker::after {
            content: "›";
            float: right;
            color: var(--text-sub);
            font-size: 16px;
            line-height: 1;
            transform: rotate(90deg);
            opacity: .55;
        }
        /* 预览模式下就不显示箭头 */
        .preview-mode .cell-value.has-picker::after { display: none; }

        /* 选择器遮罩 */
        .picker-mask {
            position: fixed; left: 0; right: 0; top: 0; bottom: 0;
            background: rgba(0, 0, 0, .45);
            z-index: 1000;
            opacity: 0; pointer-events: none;
            transition: opacity .25s ease;
            display: flex; align-items: flex-end;
        }
        .picker-mask.show { opacity: 1; pointer-events: auto; }

        /* 选择器面板 */
        .picker-panel {
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px 12px 0 0;
            padding-bottom: env(safe-area-inset-bottom);
            transform: translateY(100%);
            transition: transform .28s cubic-bezier(.25, .8, .3, 1);
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        .picker-mask.show .picker-panel { transform: translateY(0); }

        .picker-header {
            display: flex; align-items: center; justify-content: space-between;
            height: 48px; padding: 0 8px;
            border-bottom: 1px solid var(--line-color);
        }
        .picker-header button {
            border: none; background: none; font-size: 15px; padding: 0 12px; height: 100%;
        }
        #picker-cancel { color: var(--text-sub); }
        #picker-confirm { color: var(--cyan-main); font-weight: 500; }
        .picker-title { font-size: 16px; font-weight: 500; color: var(--text-main); }

        .picker-body { position: relative; height: 220px; }

        /* 选中高亮条（中间那一行） */
        .picker-indicator {
            position: absolute; left: 16px; right: 16px; top: 88px; height: 44px;
            border-top: 1px solid var(--line-color);
            border-bottom: 1px solid var(--line-color);
            pointer-events: none; z-index: 1;
        }

        /* 滚轮容器 */
        .picker-columns { display: flex; height: 100%; position: relative; z-index: 2; }
        .picker-col {
            flex: 1; height: 100%; overflow-y: scroll;
            scroll-snap-type: y mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            position: relative;
        }
        .picker-col::-webkit-scrollbar { display: none; }

        /* 每个选项 44px 高，中间留 88px 上下空白让首尾也能滚到中间 */
        .picker-col .item {
            height: 44px; line-height: 44px;
            text-align: center;
            font-size: 17px;
            color: var(--text-main);
            scroll-snap-align: center;
            white-space: nowrap;
            transition: color .1s;
        }
        .picker-col .item.dim { color: var(--text-sub); }

        /* 选择器拖拽期间禁掉页面滚动 */
        body.picker-open { overflow: hidden; }

        /* ============ 新增：自动计算字段 & 可编辑审核人 & 选项滚轮 ============ */

        /* 请假天数由开始/结束时间自动算出，不给手改 */
        input.readonly { color: #323233 !important; pointer-events: none; }
        .preview-mode input.readonly { pointer-events: none; }

        /* 审核流程里的灰色时间：只读展示，不再点击编辑 */
        .cell-time.readonly-time { pointer-events: none; color: var(--text-sub); }

        /* “审核人：”后面的行内输入框，长度自适应，保持和原文字同色同字号 */
        input.inline-input {
            display: inline-block;
            width: auto;
            min-width: 56px;
            max-width: 150px;
            color: var(--text-sub) !important;
            -webkit-text-fill-color: var(--text-sub);
            pointer-events: auto;
            font-size: 13px;
            line-height: inherit;
            vertical-align: baseline;
        }
        .preview-mode input.inline-input { pointer-events: none; }
        .edit-mode input.inline-input { border-bottom: 1px dashed var(--cyan-main); }

        /* 选项型滚轮只有一列，居中并适当收窄，避免文字太长贴边 */
        .picker-columns.single .picker-col { flex: 0 0 78%; margin: 0 auto; }
    </style>
</head>

<script>
    /* ================= 原有逻辑 ================= */
    function updateModeBtn() {
        const isEdit = document.body.classList.contains('edit-mode');
        const btn = document.getElementById('mode-btn');
        // 预览态入口是个无字小黑块；进入编辑后带“预览”二字，点它回到预览并收起
        btn.textContent = isEdit ? '预览' : '';
        btn.title = isEdit ? '预览模式' : '编辑模式';
        btn.classList.toggle('with-label', isEdit);
    }

    function toggleMode() {
        const body = document.body;
        const isEdit = body.classList.contains('edit-mode');
        body.classList.toggle('edit-mode', !isEdit);
        body.classList.toggle('preview-mode', isEdit);
        // 从编辑切回预览时收起黑块，下次长按“定位销假”再出现
        if (isEdit) {
            document.getElementById('mode-btn').setAttribute('hidden', '');
        }
        updateModeBtn();
    }

    function handleFile(input) {
        const fileNameDisplay = document.getElementById('file-name');
        const fileSizeDisplay = document.getElementById('file-size');
        if (input.files && input.files[0]) {
            const file = input.files[0];
            fileNameDisplay.textContent = file.name;
            const size = file.size > 1024 * 1024 
                ? (file.size / (1024 * 1024)).toFixed(2) + 'MB' 
                : (file.size / 1024).toFixed(2) + 'KB';
            fileSizeDisplay.textContent = size;
        }
    }

    /* ================= 新增：时间滚动选择器 =================
       用法：
         1) 页面里任意元素加 data-picker="datetime"（或 "date" / "time"），
            点它就会弹出中间那行高亮的滚轮选择器。
         2) 带 data-picker 的 .cell-value 里有 <input> 时，选中结果自动写回 input；
            没有 input 时，写回 .date-line / .time-line 两个 span。
         3) data-optional="1" 表示允许清空（如“销假日期”）。
         4) 也可以在别处手动调用 openPicker(dateObj, {mode, title, onConfirm, allowEmpty})。
    ========================================================= */

    const ITEM_H = 44;            // 每个选项高度，和 CSS .item 的 height 保持一致
    const HOURS = Array.from({length: 24}, (_, i) => String(i).padStart(2, '0'));
    const MINUTES = Array.from({length: 60}, (_, i) => String(i).padStart(2, '0'));

    const pickerMask = document.getElementById('picker-mask');
    const pickerTitle = document.getElementById('picker-title');
    const pickerColumns = document.getElementById('picker-columns');
    const pickerCancel = document.getElementById('picker-cancel');
    const pickerConfirm = document.getElementById('picker-confirm');

    let pickerState = null;       // { mode, onConfirm, allowEmpty, cols, value, target }
    let opening = false;          // 防止打开动画期间被误点关闭

    /* ---------- 工具函数 ---------- */
    function pad2(n) { return String(n).padStart(2, '0'); }

    function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); } // m: 1-12

    // "2026-04-22 08:00" / "2026-04-22 8:00:30" / "2026-04-22" / "08:00" 都能解析
    function parseDateTime(str, mode, fallback) {
        const now = new Date();
        let y = now.getFullYear(), mo = now.getMonth() + 1, d = now.getDate();
        let h = now.getHours(), mi = now.getMinutes();
        if (str) {
            var mDate = str.match(/(\d{4})\s*[-\/年]\s*(\d{1,2})\s*[-\/月]\s*(\d{1,2})/);
            if (mDate) { y = +mDate[1]; mo = +mDate[2]; d = +mDate[3]; }
            var mTime = str.match(/(\d{1,2})\s*:\s*(\d{1,2})/);
            if (mTime) { h = +mTime[1]; mi = +mTime[2]; }
        } else if (fallback) {
            return fallback;
        }
        mo = Math.min(12, Math.max(1, mo));
        d = Math.min(daysInMonth(y, mo), Math.max(1, d));
        h = Math.min(23, Math.max(0, h));
        mi = Math.min(59, Math.max(0, mi));
        return { y: y, m: mo, d: d, h: h, mi: mi };
    }

    function formatDateTime(v, mode) {
        const datePart = v.y + '-' + pad2(v.m) + '-' + pad2(v.d);
        const timePart = pad2(v.h) + ':' + pad2(v.mi);
        if (mode === 'date') return datePart;
        if (mode === 'time') return timePart;
        return datePart + ' ' + timePart;
    }

    // 年份 + 2 位月日 + 时分，拼成便于比较的字符串
    function ymdhi(d) {
        return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate())
             + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    }

    function ymd(d) {
        return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
    }

    function hm(d) {
        return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    }

    // 统一解析成 Date；解析不出来返回 null
    function parseToDate(str) {
        if (!str) return null;
        const v = parseDateTime(String(str), 'datetime', null);
        if (!v) return null;
        return new Date(v.y, v.m - 1, v.d, v.h, v.mi, 0, 0);
    }

    /* ---------- 选项数据（下拉/滚轮两用） ---------- */
    const OPTION_SETS = {
        // 是否出校 / 是否离开学校所在地
        yesno: ['是', '否'],
        // 请假类型
        leaveType: ['事假', '病假', '公假', '丧假', '婚假', '产假', '其他'],
        // 请假性质
        leaveNature: ['因私请假', '因公请假', '因病请假', '因事请假'],
        // 学年：以当前年为界前后各展开若干年
        year: (function () {
            const cur = new Date().getFullYear();
            const list = [];
            for (let y = cur - 3; y <= cur + 3; y++) {
                list.push(y + '-' + (y + 1) + '学年');
            }
            return list;
        })()
    };

    // data-options 里可以直接写 "@yesno" 这样的引用，也可以用 "|" 分隔写死
    function resolveOptions(expr) {
        if (!expr) return [];
        const key = expr.replace(/^@/, '').trim();
        if (Array.isArray(OPTION_SETS[key])) return OPTION_SETS[key];
        return expr.split('|').map(s => s.trim()).filter(Boolean);
    }

    /* ---------- 构建滚轮 ---------- */
    function buildColumn(options, currentIndex, formatter) {
        const col = document.createElement('div');
        col.className = 'picker-col';

        // 上下各留出 (220-44)/2 = 88px 的空白，让第一项和最后一项也能滚到中间
        const padTop = document.createElement('div');
        padTop.style.height = ((220 - ITEM_H) / 2) + 'px';
        padTop.style.flex = '0 0 auto';
        col.appendChild(padTop);

        options.forEach(function (opt, i) {
            const item = document.createElement('div');
            item.className = 'item';
            item.textContent = formatter ? formatter(opt) : opt;
            item.dataset.index = i;
            col.appendChild(item);
        });

        const padBottom = document.createElement('div');
        padBottom.style.height = ((220 - ITEM_H) / 2) + 'px';
        padBottom.style.flex = '0 0 auto';
        col.appendChild(padBottom);

        // 点击某一项：滚到中间并更新
        col.addEventListener('click', function (e) {
            const item = e.target.closest('.item');
            if (!item) return;
            const idx = +item.dataset.index;
            scrollColumnTo(col, idx, true);
            markColumn(col, idx);
            if (pickerState && pickerState.onChange) pickerState.onChange();
        });

        // 手指滚动结束后再对齐一次（scroll-snap 已处理吸附，这里补齐逻辑）
        col.addEventListener('scrollend', function () {
            const idx = Math.round(col.scrollTop / ITEM_H);
            markColumn(col, idx);
            if (pickerState && pickerState.onChange) pickerState.onChange();
        });

        // 兜底：滚动中实时高亮最近的项（兼容没有 scrollend 的浏览器）
        col.addEventListener('scroll', function () {
            const idxNow = Math.round(col.scrollTop / ITEM_H);
            markColumn(col, idxNow);
        }, { passive: true });

        col.valueIndex = 0;
        // 先挂到 DOM 后才好设置 scrollTop
        col._initIndex = currentIndex;
        return col;
    }

    function scrollColumnTo(col, index, smooth) {
        const max = col.children.length - 3; // 去掉上下两个 padding
        index = Math.max(0, Math.min(max, index));
        col.valueIndex = index;              // 立即确认选中值，不依赖动画是否真的跑完
        const top = index * ITEM_H;
        if (smooth && typeof col.scrollTo === 'function') {
            col.scrollTo({ top: top, behavior: 'smooth' });
        } else {
            col.scrollTop = top;
        }
        markColumn(col, index);
    }

    function markColumn(col, activeIndex) {
        col.valueIndex = activeIndex;
        const items = col.children;
        for (let i = 0; i < items.length; i++) {
            const el = items[i];
            if (!el.classList || !el.classList.contains('item')) continue;
            const idx = +el.dataset.index;
            const dist = Math.abs(idx - activeIndex);
            el.classList.toggle('dim', dist > 0);
        }
    }

    /* ---------- 打开 / 关闭 ---------- */
    function openPicker(initialValue, opts) {
        opts = opts || {};
        const mode = opts.mode || 'datetime';
        const now = new Date();
        const fallback = { y: now.getFullYear(), m: now.getMonth() + 1, d: now.getDate(), h: now.getHours(), mi: now.getMinutes() };

        pickerMask.classList.add('show');
        document.body.classList.add('picker-open');
        opening = true;

        pickerColumns.innerHTML = '';

        /* ===== 选项型滚轮：是否出校、请假类型、学年这类枚举值 ===== */
        if (mode === 'option') {
            const options = opts.options || [];
            if (!options.length) {
                closePicker();
                return;
            }
            pickerState = {
                mode: mode,
                options: options,
                onConfirm: opts.onConfirm || function () {},
                allowEmpty: false,
                cols: [],
                onChange: null
            };
            pickerCancel.textContent = '取消';
            pickerTitle.textContent = opts.title || '请选择';
            pickerColumns.classList.add('single');

            const idx = Math.max(0, options.indexOf(String(initialValue || '').trim()));
            const col = buildColumn(options, idx);
            pickerColumns.appendChild(col);
            pickerState.cols = [{ key: 'val', el: col, options: options }];

            requestAnimationFrame(function () {
                requestAnimationFrame(function () {
                    scrollColumnTo(col, idx, false);
                    setTimeout(function () { opening = false; }, 60);
                });
            });
            return;
        }

        /* ===== 时间型滚轮：年月日时分 ===== */
        pickerColumns.classList.remove('single');
        const value = parseDateTime(initialValue, mode, fallback);

        pickerState = {
            mode: mode,
            onConfirm: opts.onConfirm || function () {},
            allowEmpty: !!opts.allowEmpty,
            value: value,
            cols: []
        };
        // 可选清空时，标题右侧增加“清空”
        pickerCancel.textContent = pickerState.allowEmpty ? '清空' : '取消';
        pickerTitle.textContent = opts.title || (mode === 'date' ? '选择日期' : mode === 'time' ? '选择时间' : '选择日期时间');

        const cols = [];

        // 年（当前年前后各 10 年 + 输入值所在年）
        if (mode !== 'time') {
            const years = [];
            const y0 = Math.min(Math.min(now.getFullYear() - 10, value.y), value.y);
            for (let y = y0; y <= Math.max(now.getFullYear() + 10, value.y); y++) years.push(y);
            cols.push({ key: 'y', el: buildColumn(years, years.indexOf(value.y), v => v + '年'), options: years });
        }
        // 月
        if (mode !== 'time') {
            const months = Array.from({length: 12}, (_, i) => i + 1);
            cols.push({ key: 'm', el: buildColumn(months, value.m - 1, v => pad2(v) + '月'), options: months });
        }
        // 日（随年月动态变化）
        if (mode !== 'time') {
            const days = Array.from({length: daysInMonth(value.y, value.m)}, (_, i) => i + 1);
            cols.push({ key: 'd', el: buildColumn(days, value.d - 1, v => pad2(v) + '日'), options: days });
        }
        // 时
        if (mode !== 'date') {
            cols.push({ key: 'h', el: buildColumn(HOURS, value.h, v => v + '时'), options: HOURS });
        }
        // 分
        if (mode !== 'date') {
            cols.push({ key: 'mi', el: buildColumn(MINUTES, value.mi, v => v + '分'), options: MINUTES });
        }

        cols.forEach(function (c) { pickerColumns.appendChild(c.el); });
        pickerState.cols = cols;

        // 年月变化时重建“日”这一列，保证 2 月 29 日之类不会越界
        pickerState.onChange = function () {
            if (mode === 'time' || !pickerState) return;
            const yCol = pickerState.cols.find(c => c.key === 'y');
            const mCol = pickerState.cols.find(c => c.key === 'm');
            const dCol = pickerState.cols.find(c => c.key === 'd');
            if (!yCol || !mCol || !dCol) return;
            const y = yCol.options[yCol.el.valueIndex];
            const m = mCol.options[mCol.el.valueIndex];
            const maxD = daysInMonth(y, m);
            const currentDays = dCol.options.length;
            if (maxD !== currentDays) {
                const keep = Math.min(dCol.el.valueIndex + 1, maxD);
                const newDays = Array.from({length: maxD}, (_, i) => i + 1);
                const newEl = buildColumn(newDays, keep - 1, v => pad2(v) + '日');
                dCol.el.replaceWith(newEl);   // 原地替换，列顺序不变
                dCol.el = newEl;
                dCol.options = newDays;
                requestAnimationFrame(function () {
                    scrollColumnTo(newEl, keep - 1, false);
                });
            }
        };

        // 打开动画结束后再滚到目标位置，避免 scrollTo 在被隐藏时失效
        pickerMask.classList.add('show');
        document.body.classList.add('picker-open');
        opening = true;
        requestAnimationFrame(function () {
            requestAnimationFrame(function () {
                cols.forEach(function (c) {
                    scrollColumnTo(c.el, c.el._initIndex, false);
                });
                setTimeout(function () { opening = false; }, 60);
            });
        });
    }

    function closePicker() {
        pickerMask.classList.remove('show');
        document.body.classList.remove('picker-open');
        pickerState = null;
    }

    function confirmPicker() {
        if (!pickerState) return;

        // 选项型：直接把选中的文字原样回传
        if (pickerState.mode === 'option') {
            const c = pickerState.cols[0];
            const picked = c.options[c.el.valueIndex];
            const cb = pickerState.onConfirm;
            closePicker();
            cb({ text: picked, value: picked, mode: 'option' });
            return;
        }

        const res = {};
        pickerState.cols.forEach(function (c) {
            res[c.key] = c.options[c.el.valueIndex];
        });
        const now = new Date();
        const finalY = res.y || now.getFullYear();
        const finalM = res.m || 1;
        const finalD = res.d || 1;
        const finalH = res.h !== undefined ? res.h : 0;
        const finalMi = res.mi !== undefined ? res.mi : 0;

        let dateObj;
        if (pickerState.mode !== 'time') {
            dateObj = new Date(finalY, finalM - 1, finalD);
        } else {
            dateObj = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        }
        if (pickerState.mode !== 'date') {
            dateObj.setHours(finalH, finalMi, 0, 0);
        } else {
            dateObj.setHours(0, 0, 0, 0);
        }

        const payload = {
            date: dateObj,
            y: finalY, m: finalM, d: finalD, h: finalH, mi: finalMi,
            text: formatDateTime({ y: finalY, m: finalM, d: finalD, h: finalH, mi: finalMi }, pickerState.mode),
            mode: pickerState.mode
        };
        const cb = pickerState.onConfirm;
        closePicker();
        cb(payload);
    }

    /* ---------- 绑定事件 ---------- */
    pickerConfirm.addEventListener('click', confirmPicker);

    pickerCancel.addEventListener('click', function () {
        // 可选字段：点“清空”直接清掉值
        if (pickerState && pickerState.allowEmpty) {
            const cb = pickerState.onConfirm;
            const mode = pickerState.mode;
            closePicker();
            cb({ empty: true, text: '', mode: mode });
            return;
        }
        closePicker();
    });

    pickerMask.addEventListener('click', function (e) {
        if (opening) return;
        if (e.target === pickerMask) closePicker();
    });

    document.addEventListener('keydown', function (e) {
        if (!pickerState) return;
        if (e.key === 'Escape') closePicker();
        if (e.key === 'Enter') confirmPicker();
    });

    // 给页面上所有 data-picker 元素挂点击事件
    function bindPickers() {
        document.querySelectorAll('[data-picker]').forEach(function (el) {
            if (el._pickerBound) return;
            el._pickerBound = true;
            el.addEventListener('click', function (e) {
                // 预览模式下不弹出
                if (document.body.classList.contains('preview-mode')) return;
                e.preventDefault();
                e.stopPropagation();

                const mode = el.dataset.picker || 'datetime';
                const optional = el.dataset.optional === '1';
                const input = el.querySelector('input[type="text"]');
                const dateLine = el.querySelector('.date-line');
                const timeLine = el.querySelector('.time-line');

                let current = '';
                if (input) current = input.value.trim();
                else if (dateLine || timeLine) {
                    current = ((dateLine && dateLine.textContent) || '') + ' ' + ((timeLine && timeLine.textContent) || '');
                }

                // 标题取左侧 label 文字
                const cell = el.closest('.cell');
                const labelEl = cell && cell.querySelector('.cell-label');
                const title = labelEl ? labelEl.textContent.trim() : '选择时间';

                openPicker(current, {
                    mode: mode,
                    title: title,
                    allowEmpty: optional,
                    options: mode === 'option' ? resolveOptions(el.dataset.options) : undefined,
                    onConfirm: function (res) {
                        if (res.empty) {
                            if (input) input.value = '';
                            if (dateLine) dateLine.textContent = '';
                            if (timeLine) timeLine.textContent = '';
                            return;
                        }
                        if (input) {
                            input.value = res.text;
                        } else {
                            if (dateLine) dateLine.textContent = res.y + '-' + pad2(res.m) + '-' + pad2(res.d);
                            if (timeLine) timeLine.textContent = pad2(res.h) + ':' + pad2(res.mi);
                        }
                        // 让外部能听到变化
                        el.dispatchEvent(new CustomEvent('datetimechange', { detail: res, bubbles: true }));
                        // 页面内部的联动逻辑
                        if (typeof el._afterPick === 'function') el._afterPick(res);
                    }
                });
            });
        });
    }

    /* ================= 请假信息联动 =================
       1. 选完「请假开始日期」→ 申请日期 = 开始时间 - 3 小时（跨天自动处理）
       2. 申请日期变了 → 审核流程：提交申请时间同步；辅导员审核时间 + 1 小时
       3. 开始/结束时间变了 → 请假天数自动计算（按小时换算成天，保留两位）
       ================================================= */
    const $ = function (id) { return document.getElementById(id); };

    // 把 Date 写进“年-月-日 / 时:分”两行显示
    function writeStepTime(prefix, d) {
        const dateEl = $(prefix + '-date');
        const timeEl = $(prefix + '-time');
        if (dateEl) dateEl.textContent = ymd(d);
        if (timeEl) timeEl.textContent = hm(d);
    }

    // 申请日期变化后，同步审核流程的两个时间戳
    function syncAuditSteps() {
        const applyEl = $('apply-time');
        if (!applyEl) return;
        const applied = parseToDate(applyEl.value);
        if (!applied) return;
        writeStepTime('step0', applied);
        writeStepTime('step1', new Date(applied.getTime() + 60 * 60 * 1000));
    }

    // 按开始/结束时间算请假天数；不足一天按小时折算
    function recalcLeaveDays() {
        const daysEl = $('leave-days');
        const startEl = $('start-time');
        const endEl = $('end-time');
        if (!daysEl || !startEl || !endEl) return;
        const start = parseToDate(startEl.value);
        const end = parseToDate(endEl.value);
        if (!start || !end) { daysEl.value = ''; return; }
        let diffH = (end.getTime() - start.getTime()) / 36e5;
        const days = Math.round(Math.max(0, diffH) / 24 * 100) / 100;
        daysEl.value = days.toFixed(2);
    }

    // 申请日期整体前移 3 小时（含跨月、跨年）
    function applyFromStart() {
        const startEl = $('start-time');
        const applyEl = $('apply-time');
        if (!startEl || !applyEl) return;
        const start = parseToDate(startEl.value);
        if (!start) return;
        const applied = new Date(start.getTime() - 3 * 60 * 60 * 1000);
        applyEl.value = ymdhi(applied);
        syncAuditSteps();
    }

    function bindLeaveLogic() {
        const applyCell = $('apply-time') && $('apply-time').closest('[data-picker]');
        const startCell = $('start-time') && $('start-time').closest('[data-picker]');
        const endCell = $('end-time') && $('end-time').closest('[data-picker]');

        // 手动改申请日期（滚轮选）→ 只同步审核流程
        if (applyCell) applyCell._afterPick = function () { syncAuditSteps(); };

        // 选完请假开始时间 → 申请时间 = 开始 - 3h，再联动审核流程
        if (startCell) startCell._afterPick = function () {
            applyFromStart();
            recalcLeaveDays();
        };

        if (endCell) endCell._afterPick = function () {
            // 先按新的结束时间算天数，再做越界回退，避免时序问题
            recalcLeaveDays();
            const start = parseToDate($('start-time').value);
            const end = parseToDate($('end-time').value);
            // 结束时间被选到开始时间之前且同一天：把开始时间顺延到结束时间，保证天数非负
            if (start && end && end.getTime() < start.getTime()) {
                $('leave-days').value = '0.00';
            }
        };

        // 审核人输入框：内容变长变短时自适应宽度，不撑破布局
        const reviewer = $('reviewer');
        if (reviewer) {
            const fit = function () {
                reviewer.style.width = Math.min(150, Math.max(56, reviewer.value.length * 13 + 8)) + 'px';
            };
            reviewer.addEventListener('input', fit);
            fit();
        }

        syncAuditSteps();
        recalcLeaveDays();
    }

    /* ================= 页内 404 提示 =================
       “定位销假 / 续假申请”在这个静态页面里没有对应路由，
       直接弹本页的提示层，不再跳到不存在的地址（否则会变成真 404）。
       ================================================ */
    function showNotFound(which) {
        const mask = $('nf-mask');
        if (!mask) return;
        const isRenew = which === 'renew';
        $('nf-title').textContent = isRenew ? '续假申请' : '定位销假';
        $('nf-desc').textContent = isRenew
            ? '续假申请功能暂未开放，请到学校请假系统内提交续假。'
            : '定位销假功能暂未开放，请到学校请假系统内完成销假定位。';
        mask.classList.add('show');
        document.body.classList.add('picker-open');
    }

    function hideNotFound() {
        const mask = $('nf-mask');
        if (!mask) return;
        mask.classList.remove('show');
        // 只有在没有打开滚轮的情况下才恢复页面滚动
        if (!$('picker-mask') || !$('picker-mask').classList.contains('show')) {
            document.body.classList.remove('picker-open');
        }
    }

    function bindNotFound() {
        const mask = $('nf-mask');
        if (!mask) return;
        mask.addEventListener('click', function (e) {
            if (e.target === mask) hideNotFound();
        });
        $('nf-ok').addEventListener('click', hideNotFound);
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && mask.classList.contains('show')) hideNotFound();
        });
    }

    /* ================= 长按“定位销假”解锁编辑入口 =================
       默认不显示 #mode-btn；长按 800ms 后出现，点它切换编辑/预览
       ============================================================== */
    const LONG_PRESS_MS = 800;
    const modeBtn = document.getElementById('mode-btn');
    const locateBtn = document.getElementById('locate-btn');
    let longPressTimer = null;
    let longPressFired = false;

    function isModeBtnVisible() {
        return modeBtn && !modeBtn.hasAttribute('hidden');
    }

    function reachEditEntry() {
        modeBtn.removeAttribute('hidden');
        // 长按后震动一下，手机上有明确反馈（不支持也无妨）
        if (navigator.vibrate) {
            try { navigator.vibrate(15); } catch (e) {}
        }
    }

    function bindEditEntry() {
        if (!locateBtn || !modeBtn) return;

        const startPress = function () {
            longPressFired = false;
            clearTimeout(longPressTimer);
            longPressTimer = setTimeout(function () {
                longPressFired = true;
                reachEditEntry();
            }, LONG_PRESS_MS);
        };
        const cancelPress = function () {
            clearTimeout(longPressTimer);
        };

        // 触屏
        locateBtn.addEventListener('touchstart', startPress, { passive: true });
        locateBtn.addEventListener('touchend', cancelPress, { passive: true });
        locateBtn.addEventListener('touchcancel', cancelPress, { passive: true });
        locateBtn.addEventListener('touchmove', cancelPress, { passive: true });
        // 鼠标/触控板调试也一样能长按
        locateBtn.addEventListener('mousedown', startPress);
        locateBtn.addEventListener('mouseup', cancelPress);
        locateBtn.addEventListener('mouseleave', cancelPress);
        // 长按触发后别让 click 继续做别的事（用完立即复位，否则之后再也点不出 404）
        locateBtn.addEventListener('click', function (e) {
            if (longPressFired) {
                longPressFired = false;
                e.preventDefault();
                e.stopPropagation();
                return;
            }
            // 普通单击：弹本页 404 提示
            e.preventDefault();
            showNotFound('locate');
        });

        // 续假申请：同样弹页内 404
        const renewBtn = $('renew-btn');
        if (renewBtn) {
            renewBtn.addEventListener('click', function (e) {
                e.preventDefault();
                showNotFound('renew');
            });
        }

        // 点击黑块：编辑态下显示的是“预览”，点了就回到预览并收起黑块
        // 切回预览时的隐藏动作交给 toggleMode 统一处理，避免重复绑定
    }

    // 脚本紧贴在 </body> 前，DOM 已经解析完，直接绑定即可
    updateModeBtn();
    bindPickers();
    bindLeaveLogic();
    bindEditEntry();
    bindNotFound();
</script>
</body>
</html>
